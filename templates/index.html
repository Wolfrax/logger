<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Logger</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- DataTables with Bootstrap 5 styling -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/select/1.7.0/css/select.bootstrap5.min.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/select/1.7.0/js/dataTables.select.min.js"></script>
</head>
<body class="bg-light">

<div class="container my-4">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0"><i class="bi bi-terminal"></i> System Logs</h5>
        </div>
        <div class="card-body">
            <table id="data" class="table table-striped table-hover align-middle w-100">
                <thead class="table-light">
                <tr>
                    <th>Time</th>
                    <th>Message</th>
                    <th>Level</th>
                    <th>Path</th>
                </tr>
                </thead>
            </table>

            <button id="button" class="btn btn-danger mt-3" disabled>
                <i class="bi bi-trash"></i> Delete selected
            </button>
        </div>
    </div>
</div>

<script>
    $(document).ready(function () {
        const button = $('#button').prop('disabled', true);

        const table = $('#data').DataTable({
            info: false,
            order: [[0, 'desc']],
            paging: false,
            searching: true,
            ajax: "/logger/log",
            select: {style: 'os'},
            columns: [
                {
                    data: "created",
                    render: function (val) {
                        return new Date(parseFloat(1000 * val)).toLocaleString("sv-SE")
                    },
                },
                {data: "msg"},
                {
                    data: "levelname",
                    render: function (val) {
                        const colors = {
                            "INFO": "badge bg-info",
                            "WARNING": "badge bg-warning text-dark",
                            "ERROR": "badge bg-danger",
                            "DEBUG": "badge bg-secondary"
                        };
                        return `<span class="${colors[val] || 'badge bg-light text-dark'}">${val}</span>`;
                    }
                },
                {data: "pathname"}
            ],
        });

        // Enable/disable button when row selection changes
        table.on('select deselect', function () {
            button.prop('disabled', table.rows({selected: true}).count() === 0);
        });

        button.click(function () {
            let rowdata = table.rows({selected: true}).data();
            for (let i = 0; i < rowdata.length; i++) {
                $.ajax({
                    url: '/logger/log',
                    type: 'DELETE',
                    data: rowdata[i],
                    success: function () {
                        table.ajax.reload();
                    }
                });
            }
            button.prop('disabled', true);
        });
    });
</script>

<footer class="text-center mt-4 mb-2 text-muted small">
    &copy; Mats Melander
</footer>

</body>
</html>
